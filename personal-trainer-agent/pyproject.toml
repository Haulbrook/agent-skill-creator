[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-trainer-agent"
version = "0.1.0"
description = "A meta-tool for systematically improving AI agents through evaluation, coaching, and RL training"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Haulbrook" }
]
keywords = [
    "ai",
    "agents",
    "training",
    "reinforcement-learning",
    "evaluation",
    "coaching",
    "llm",
    "machine-learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
trl = [
    "trl>=0.7.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "datasets>=2.14.0",
    "accelerate>=0.24.0",
]
openrl = [
    "openrl>=0.2.0",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
]
anthropic = [
    "anthropic>=0.18.0",
]
openai = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
all = [
    "personal-trainer-agent[trl,openrl,anthropic,openai,dev]",
]

[project.scripts]
trainer-agent = "personal_trainer_agent.cli:main"

[project.urls]
Homepage = "https://github.com/Haulbrook/personal-trainer-agent"
Documentation = "https://github.com/Haulbrook/personal-trainer-agent#readme"
Repository = "https://github.com/Haulbrook/personal-trainer-agent"
Issues = "https://github.com/Haulbrook/personal-trainer-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_trainer_agent"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
